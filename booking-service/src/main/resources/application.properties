# ===============================
# Server
# ===============================
server.port=8080

# ===============================
# Datasource (Values come from Docker Environment)
# ===============================
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

# ===============================
# JPA
# ===============================
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# ===============================
# Flyway
# ===============================
spring.flyway.enabled=true

# ===============================
# Redis
# ===============================
spring.data.redis.host=redis
spring.data.redis.port=6379

# ===============================
# Kafka
# ===============================
# This will be overridden by SPRING_KAFKA_BOOTSTRAP_SERVERS in docker-compose
spring.kafka.bootstrap-servers=kafka:29092

spring.threads.virtual.enabled=true

# ===============================
# Security (JWT) - CRITICAL
# ===============================
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION}

# ===============================
# Razorpay (Add these to your Java Config)
# ===============================
razorpay.key.id=${RAZORPAY_KEY_ID}
razorpay.key.secret=${RAZORPAY_KEY_SECRET}

# Prefix all backend endpoints with /api
server.servlet.context-path=/api